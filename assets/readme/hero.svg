<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Lonely Shadow · 游戏王工具箱</title>
  <desc id="desc">本地卡组构筑、展开练习与逐步回看。五张起手卡牌连接展开步骤、终场和妥协分支；这是功能流程示意，不是一条具体卡组的展开教学。静态 SVG 显示完整画面，配套 GIF 依次呈现这些关系。</desc>
  <defs>
    <g id="card-symbol">
      <rect width="54" height="80" rx="6" fill="#182832" stroke="#c0e888" stroke-width="2"/>
      <rect x="6" y="7" width="42" height="66" rx="3" fill="none" stroke="#c0e888" stroke-opacity=".24"/>
      <path d="m27 23 13 17-13 17-13-17Z" fill="none" stroke="#f0d79d" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1200" height="480" rx="22" fill="#10191f"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g id="identity">
      <path d="M81 49a18 18 0 1 0 13 30A16 16 0 0 1 81 49Z" fill="#c0e888"/>
      <text x="110" y="76" font-size="24" font-weight="600" letter-spacing="5" fill="#c0e888">LONELY SHADOW</text>
      <text x="62" y="166" font-size="78" font-weight="700" letter-spacing="1" fill="#dce5e9">游戏王工具箱</text>
      <text x="66" y="217" font-size="34" fill="#a0b3bd">构筑卡组 · 练习展开 · 逐步回看</text>
    </g>
    <g id="existing-brand-mark" transform="translate(962 30) scale(.67)">
      <!-- Geometry from the project's existing moon-and-card app icon. -->
      <path d="M156 39a86 86 0 1 0 56 136A77 77 0 0 1 156 39Z" fill="#c0e888"/>
      <rect x="87" y="64" width="99" height="139" rx="13" transform="rotate(-13 137 134)" fill="#10191f"/>
      <rect x="104" y="57" width="96" height="139" rx="12" fill="#182832" stroke="#f0d79d" stroke-width="9"/>
      <path d="m152 86 25 39-25 40-25-40Z" fill="#f0d79d"/>
    </g>
    <g id="fixed-labels" fill="#dce5e9" font-size="40" font-weight="600" text-anchor="middle">
      <text x="194" y="289">起手</text>
      <text x="574" y="289">展开</text>
      <text x="1020" y="289">终场</text>
    </g>
    <g id="route-underlay" fill="none" stroke="#a0b3bd" stroke-width="2" opacity=".19">
      <path d="M320 353H912"/>
      <path d="m904 347 8 6-8 6"/>
      <rect x="438" y="322" width="70" height="64" rx="10" fill="#10191f"/>
      <rect x="638" y="322" width="70" height="64" rx="10" fill="#10191f"/>
      <path d="M572 353v53q0 24 24 24h229" stroke-dasharray="5 7"/>
    </g>
    <g id="field-underlay" fill="#182832" stroke="#a0b3bd" stroke-opacity=".25" stroke-width="1.5">
      <!-- Five main monster zones, with two shared extra zones above. -->
      <rect x="976" y="308" width="25" height="29" rx="3"/>
      <rect x="1038" y="308" width="25" height="29" rx="3"/>
      <rect x="945" y="348" width="25" height="38" rx="3"/>
      <rect x="976" y="348" width="25" height="38" rx="3"/>
      <rect x="1007" y="348" width="25" height="38" rx="3"/>
      <rect x="1038" y="348" width="25" height="38" rx="3"/>
      <rect x="1069" y="348" width="25" height="38" rx="3"/>
    </g>
    <g id="opening-underlay" opacity=".17">
      <use href="#card-symbol" transform="translate(91 328) rotate(-13 27 40)"/>
      <use href="#card-symbol" transform="translate(129 318) rotate(-6 27 40)"/>
      <use href="#card-symbol" transform="translate(243 328) rotate(13 27 40)"/>
      <use href="#card-symbol" transform="translate(205 318) rotate(6 27 40)"/>
      <use href="#card-symbol" transform="translate(167 314)"/>
    </g>
    <g id="branch-label-underlay" fill="#a0b3bd" opacity=".46" font-size="34">
      <text x="850" y="439">妥协分支</text>
    </g>
    <g id="main-route" fill="none" stroke="#c0e888" stroke-width="2.5">
      <path d="M320 353H438M508 353H638M708 353H912"/>
      <path d="m904 347 8 6-8 6"/>
      <rect x="438" y="322" width="70" height="64" rx="10" fill="#182832"/>
      <path d="m473 332 15 22-15 22-15-22Z" stroke="#f0d79d"/>
      <rect x="638" y="322" width="70" height="64" rx="10" fill="#182832"/>
      <path d="M658 336v34h26" stroke-opacity=".5"/>
      <rect x="664" y="332" width="24" height="33" rx="3" fill="#c0e888"/>
      <circle cx="572" cy="353" r="5" fill="#c0e888" stroke="none"/>
    </g>
    <g id="branch-route" fill="none" stroke="#f0d79d" stroke-width="2">
      <path d="M572 353v53q0 24 24 24h229" stroke-dasharray="5 7"/>
      <path d="m817 424 8 6-8 6"/>
      <text x="850" y="439" fill="#f0d79d" stroke="none" font-size="34">妥协分支</text>
    </g>
    <g id="opening-hand">
      <use href="#card-symbol" transform="translate(91 328) rotate(-13 27 40)"/>
      <use href="#card-symbol" transform="translate(129 318) rotate(-6 27 40)"/>
      <use href="#card-symbol" transform="translate(243 328) rotate(13 27 40)"/>
      <use href="#card-symbol" transform="translate(205 318) rotate(6 27 40)"/>
      <use href="#card-symbol" transform="translate(167 314)"/>
    </g>
    <g id="end-field" stroke="#c0e888" stroke-width="2" fill="#304638">
      <rect x="976" y="308" width="25" height="29" rx="3"/>
      <rect x="976" y="348" width="25" height="38" rx="3"/>
      <rect x="1038" y="348" width="25" height="38" rx="3"/>
      <path d="m988.5 356 7 10-7 10-7-10Zm62 0 7 10-7 10-7-10Z" stroke="#f0d79d" stroke-width="1.5" fill="none"/>
    </g>
  </g>
