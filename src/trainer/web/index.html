<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YGO 展开练习室</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/">YGO<span>展开练习室</span></a><div class="local">● 本地工作副本</div>
<nav><button id="nav-decks" class="nav active">▦　卡组编辑</button><button id="nav-history" class="nav">◷　训练历史 <span id="history-count"></span></button></nav>
<div class="side-label">我的构筑 <button id="new-deck" title="新建构筑">＋</button></div><div id="deck-list" class="deck-list"></div>
<div class="side-foot">手动操作 · 引擎结算<br>每一次展开，都有迹可循。<small id="resource-count"></small></div></aside>
<main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="editor">
<header><div><div class="eyebrow">DECK WORKSPACE</div><h1>从一副构筑开始</h1><p>挑选卡牌，保存构筑，然后在真实场地中练习展开。</p></div><button id="start-training" class="primary">开始训练 ↗</button></header>
<div class="compact-decks"><select id="compact-deck" aria-label="选择已有构筑"><option value="">选择已有构筑</option></select><button id="compact-open">打开构筑</button><button id="compact-new">新建构筑</button></div>
<div id="active-training" class="training-banner" hidden><div><strong id="active-title">训练进行中</strong><p id="active-info">请在模拟器窗口操作；过程会自动保存。</p></div><button id="end-training" class="danger">结束训练</button><button id="view-live">查看当前记录</button></div>
<div class="workspace">
<section class="panel library"><div class="panel-title"><h2>卡牌资料</h2><span id="search-count"></span></div><div class="search-row"><input id="search" type="search" placeholder="搜索卡名、编号或效果文本" aria-label="搜索卡牌"><select id="filter" aria-label="卡牌类型"><option value="">全部</option><option value="monster">怪兽</option><option value="spell">魔法</option><option value="trap">陷阱</option><option value="extra">额外</option></select></div><div id="search-results" class="card-grid"></div><div class="pager"><button id="prev-page">上一页</button><span id="page-number"></span><button id="next-page">下一页</button></div></section>
<section class="panel construction"><div class="deck-heading"><input id="deck-name" value="新构筑" aria-label="构筑名称"><button id="save-deck">保存构筑</button></div><p id="deck-status" class="muted">新构筑 · 尚未保存</p><div class="tabs" role="tablist" aria-label="构筑分区"><button class="selected" data-zone="main" role="tab">主卡组 <b id="count-main">0</b></button><button data-zone="extra" role="tab">额外 <b id="count-extra">0</b></button><button data-zone="side" role="tab">副卡组 <b id="count-side">0</b></button></div><div id="deck-cards" class="deck-cards"></div><div class="deck-note">训练主卡组 40–60 张，额外与副卡组各最多 15 张。自由练习不限制禁限卡及同名张数。副卡组保存在构筑快照中。</div></section>
<section class="panel detail" id="card-detail"><div class="empty">← 选择卡牌<br><small>查看卡图与效果说明</small></div></section>
</div></section>
<section id="history" hidden><header><div><div class="eyebrow">PRACTICE JOURNAL</div><h1>每一次展开的轨迹</h1><p>起手、选择与最终场面，保存在这一份记录里。</p></div><button id="refresh-history">刷新记录</button></header><div class="history-layout"><div id="history-list" class="panel history-list"></div><article id="report" class="panel report"><div class="empty">选择一次训练，查看过程报告。</div></article></div></section>
</main><script src="/report-view.js"></script><script src="/app.js"></script></body></html>
